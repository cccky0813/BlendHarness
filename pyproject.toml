[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blendharness"
version = "0.1.0"
description = "A self-evolving multi-agent harness for Blender, built on an agent harness written from scratch."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.31",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
blendharness-mcp = "blendharness.protocol.mcp_server:main"

[tool.setuptools.packages.find]
include = ["blendharness*"]

[tool.setuptools.package-data]
"blendharness.agents.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "blender: needs a real headless Blender (skipped when BLENDER_PATH / the default app is missing)",
]
